<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="个人工作台 · Personal Workbench — 空间 / 项目 / 任务 / 产出物 一体化指挥中心">
<meta name="color-scheme" content="light">
<title>个人工作台 · Personal Workbench</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- 顶部朱砂标识线 -->
  <div class="accent-rail" aria-hidden="true"></div>

  <div class="app" id="app">
    <!-- 左侧固定窄导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark mono">WB</div>
        <div class="brand-text">
          <div class="brand-title">个人工作台</div>
          <div class="brand-sub mono">PERSONAL&nbsp;WORKBENCH</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <!-- 主区 -->
    <main class="main" id="main">
      <header class="topbar" id="topbar"></header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <!-- 浮层容器 -->
  <div id="overlay-layer" class="overlay-layer"></div>
  <div id="toast-layer" class="toast-layer" aria-live="polite"></div>

  <noscript>
    <div style="padding:40px;font-family:sans-serif">本工作台需要启用 JavaScript 才能运行。</div>
  </noscript>

  <!-- 经典 script 顺序加载：ui → store → connectors → views → app -->
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/connectors.js"></script>
  <script src="js/view-dashboard.js"></script>
  <script src="js/view-tasks.js"></script>
  <script src="js/view-projects.js"></script>
  <script src="js/view-outputs.js"></script>
  <script src="js/view-review.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
